<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You K ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-pink: #ffe4e9;
            --premium-red: linear-gradient(145deg, #ff5f6d, #e94d58, #c72c41);
            --premium-red-hover: linear-gradient(145deg, #ff7b87, #ff5f6d, #e94d58);
            --premium-white: linear-gradient(145deg, #ffffff, #fff0f3);
            --accent-red: #e94d58;
            --shadow-glow: rgba(233, 77, 88, 0.4);
            --shadow-intense: rgba(233, 77, 88, 0.6);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Lora', serif;
            background: linear-gradient(135deg, #fff5f6 0%, var(--bg-pink) 100%);
            display: flex; justify-content: center; align-items: center;
            scroll-behavior: smooth;
        }

        /* --- PREMIUM OVERLAY DESIGN --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff 0%, #ffe4e9 100%);
            z-index: 2000; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .overlay-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(233, 77, 88, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 80%;
        }

        .pulse-heart {
            font-size: 4rem;
            color: var(--accent-red);
            animation: heartBeat 1.5s infinite;
            margin-bottom: 20px;
            display: inline-block;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .overlay-hint {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- CLEAN MAIN PAGE DESIGN --- */
        #volume-control {
            position: fixed; top: 20px; right: 20px;
            z-index: 1500; background: white;
            width: 45px; height: 45px; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 1.2rem; transition: transform 0.3s;
        }

        .container {
            text-align: center; z-index: 1; width: 100%; max-width: 600px;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }

        h1 { 
            font-family: 'Lora', serif; 
            color: var(--accent-red); 
            font-size: 3.5rem; 
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
            font-weight: 600;
        }

        #main-gif { 
            width: 240px; height: 240px; 
            border-radius: 25px; 
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(233, 77, 88, 0.2);
            border: 5px solid white;
            transition: transform 0.4s ease;
            background-color: white;
        }

        .buttons-wrapper {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; margin-top: 20px; position: relative; min-height: 80px;
        }

        button { 
            padding: 15px 40px; font-size: 1.1rem; border: none;
            border-radius: 50px; cursor: pointer; font-weight: 600;
            font-family: 'Lora', serif; white-space: nowrap;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yes-btn { 
            background: var(--premium-red); color: white; 
            box-shadow: 0 10px 25px var(--shadow-glow);
        }

        #yes-btn:hover {
            background: var(--premium-red-hover);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px var(--shadow-intense);
        }

        #no-btn { 
            background: var(--premium-white); color: var(--accent-red); 
            border: 1px solid rgba(233, 77, 88, 0.2);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.3s ease;
        }

        #letter-container { 
            display: none; 
            margin-top: 20px; 
            width: 100%;
        }

        .letter-content { 
            display: none; background: white; padding: 35px; 
            border-radius: 30px; margin: 20px auto; color: #444; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            max-width: 85%; line-height: 1.8;
            border-top: 8px solid var(--accent-red);
            animation: fadeIn 0.6s ease;
        }

        .download-section {
            background: #fffafa;
            border: 2px dashed var(--bg-pink);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 25px;
            background: var(--premium-red);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 10px var(--shadow-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="volume-control" onclick="toggleMusic()">🔊</div>

    <div id="overlay">
        <div class="overlay-card">
            <div class="pulse-heart">❤️</div>
            <h2 style="font-family: 'Lora', serif; color: var(--accent-red); font-size: 2.8rem; margin: 0 0 10px 0; font-weight: 600;">A Valentine’s Note.</h2>
            <p class="overlay-hint">A special message awaits</p>
            <button onclick="startExperience()" style="background: var(--premium-red); color: white; padding: 18px 45px; border-radius: 50px; font-size: 1.2rem; box-shadow: 0 10px 20px var(--shadow-glow);">Open Message</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="soeasy.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img id="main-gif" src="racoon.gif" alt="Raccoon">
        <h1 id="question">Fine girl, will you be my Valentine?</h1>

        <div class="buttons-wrapper" id="btn-group">
            <button id="yes-btn" onclick="handleYesClick()">Absolutely 💖</button>
            <button id="no-btn" onmouseover="moveButton()">Ummm... 🤨</button>
        </div>

        <div id="letter-container">
            <div class="envelope" onclick="openLetter()" style="font-size: 5rem; cursor: pointer;">✉️</div>
            <div class="letter-content" id="letter-text">
                <p style="font-family: 'Lora', serif; font-size: 2rem; color: var(--accent-red); margin-top: 0; font-weight: 600;">My Bubba,</p>
                <p style="font-family: 'Lora', serif;">Every day feels like Valentine's Day with you. I couldn't imagine celebrating this with anyone else. <br><br>
                Forever yours. ❤️</p>

                <div class="download-section">
                    <p style="font-size: 0.9rem; margin-bottom: 5px;">I've prepared our invitation here!</p>
                    <a href="Valentines Invitation.jpeg" download target="_blank" rel="noopener noreferrer" class="download-btn">📥 Download Invitation</a>
                </div>
                
                <button onclick="resetPage()" style="margin-top:20px; padding:10px 20px; border-radius:20px; border:1px solid var(--accent-red); cursor:pointer; background:none; color:var(--accent-red); font-family: 'Lora', serif;">Restart Experience</button>
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const mainGif = document.getElementById('main-gif');
        const question = document.getElementById('question');
        const btnGroup = document.getElementById('btn-group');
        const letterContainer = document.getElementById('letter-container');
        const music = document.getElementById('bg-music');
        const volumeIcon = document.getElementById('volume-control');

        let clickCount = 0;
        let isMuted = false;
        const stages = [
            { text: "Are you sure?? 🤨", gif: "cat1.gif" },
            { text: "Are you REALLY sure?? 🧐", gif: "speed.gif" },
            { text: "Think about it again.. 🥺", gif: "puppy-dog.gif" },
            { text: "Pretty please? ❤️", gif: "aw-shucks.gif" }
        ];

        function startExperience() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                volumeIcon.style.display = 'flex';
                music.play();
            }, 800);
        }

        function toggleMusic() {
            if (isMuted) { music.play(); volumeIcon.innerHTML = "🔊"; } 
            else { music.pause(); volumeIcon.innerHTML = "🔇"; }
            isMuted = !isMuted;
        }

        function moveButton() {
            const padding = 100;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.max(padding, Math.random() * maxX) + 'px';
            noBtn.style.top = Math.max(padding, Math.random() * maxY) + 'px';
            noBtn.style.zIndex = "1000";
        }

        function handleYesClick() {
            if (clickCount < stages.length) {
                mainGif.style.transform = "scale(0.8)";
                setTimeout(() => {
                    question.innerHTML = stages[clickCount].text;
                    mainGif.src = stages[clickCount].gif;
                    mainGif.style.transform = "scale(1)";
                    yesBtn.style.transform = `scale(${1 + (clickCount * 0.15)})`;
                    clickCount++;
                }, 200);
            } else { celebrate(); }
        }

        function celebrate() {
            mainGif.src = "snoopy-dance.gif";
            question.style.fontSize = "2.8rem";
            question.style.whiteSpace = "nowrap"; 
            question.innerHTML = "LET'S GOOO! See you on the 16th! ❤️";
            btnGroup.style.display = 'none';
            letterContainer.style.display = 'block';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function openLetter() {
            const content = document.getElementById('letter-text');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
            if(content.style.display === 'block') {
                setTimeout(() => { content.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
            }
        }

        function resetPage() {
            location.reload();
        }
    </script>
</body>
 
</html >
